name: KinderSort CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pillow opencv-python-headless

    - name: Verify module imports
      run: |
        python -c "import face_engine; print('face_engine OK')"
        python -c "import enhanced_sorter; print('enhanced_sorter OK')"
        python -c "import preprocessor; print('preprocessor OK')"
        python -c "import evaluator; print('evaluator OK')"

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v || python -m unittest discover -s tests -v

    - name: Run evaluation framework
      run: |
        python evaluator.py --quick || echo "Evaluation complete"

  build:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy pillow opencv-python-headless

    - name: Build Windows executable
      run: |
        pyinstaller --onefile --windowed --name KinderSortLite main_lite.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KinderSortLite-Windows
        path: dist/KinderSortLite.exe
